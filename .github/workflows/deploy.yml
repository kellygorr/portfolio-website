name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required to mint the OIDC token for AWS
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::606984489046:role/portfolio-website-github-deploy
          aws-region: us-west-1

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://kellygorr.com \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          aws s3 sync dist/ s3://kellygorr.com \
            --delete \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3HSW8X75YC24Y \
            --paths "/*"
